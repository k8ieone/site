title: Kate's site
baseURL: https://k8ie.one/
theme: tesk-hugo-port
languageCode: en-us
capitalizeListTitles: false

params:
  logo: "logos/avatar.png"
  footer_items:
  - Avatar courtesy of a long deleted [picrew](https://picrew.me/en) template
  donations:
    text: |
      I would be honored if you chose to donate to my hijinxes.
      Receiving support for my work is incredibly motivating.
    platforms:
      - name: Liberapay
        address: https://liberapay.com/k8ie
        logo: logos/donations/liberapay.svg
      - name: Bitcoin
        address: https://coinos.io/k8ie
        text: Support me with
        logo: logos/donations/bitcoin.svg
  #google_site_verification: "insert_token"
  fediverse_creator: "@k8ie@toot.mcld.eu"
  article_author: "Kateřina Medvědová"
  comments_html_snippet: |
    <section class="toc">
      <details class="card">
        <summary class="big"><strong>Comments</strong></summary>
        <div class="statements" id="coral_thread"></div>
      </details>
    </section>
    <script type="text/javascript">
      (function() {
          var d = document, s = d.createElement('script');
          s.src = 'https://comments.mcld.eu/assets/js/embed.js';
          s.async = false;
          s.defer = true;
          s.onload = function() {
              Coral.createStreamEmbed({
                  id: "coral_thread",
                  autoRender: true,
                  rootURL: 'https://comments.mcld.eu',
                  // Uncomment these lines and replace with the ID of the
                  // story's ID and URL from your CMS to provide the
                  // tightest integration. Refer to our documentation at
                  // https://docs.coralproject.net for all the configuration
                  // options.
                  // storyID: '${storyID}',
                  // storyURL: '${storyURL}',
              });
          };
          (d.head || d.body).appendChild(s);
      })();
    </script>

module:
  hugoVersion:
    extended: True
    min: '0.146.0'

markup:
  goldmark:
    parser:
      attribute:
        block: true

services:
  rss:
    limit: -1

taxonomies:
  tag: tags
